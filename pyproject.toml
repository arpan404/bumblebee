[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-bumblebee"
version = "1.0.2"
description = "An AI-powered Python package for natural, human-like mouse and keyboard control."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "socioy", email = "bumblebee@socioy.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=2.2.4",
  "pyautogui>=0.9.54",
  "pynput>=1.8.1",
  "scipy>=1.15.2",
  "torch>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/socioy/bumblebee"
Repository = "https://github.com/socioy/bumblebee"

[dependency-groups]
dev = [
  "black>=25.1.0",
  "isort>=6.0.1",
  "twine>=6.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bumblebee"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/bumblebee",
  "/README.md",
  "/LICENSE.md",
]

[tool.hatch.build.targets.wheel.force-include]
"src/bumblebee/ai/models/bumblebee-c-v1.pth" = "bumblebee/ai/models/bumblebee-c-v1.pth"

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
src_paths = ["src"]
