[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-bumblebee"
version = "2.0.0"
description = "Human-like mouse and keyboard automation with an optional packaged RL mouse policy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "arpan404", email = "bumblebee@socioy.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=2.2.4",
  "pyautogui>=0.9.54",
  "pynput>=1.8.1",
  "pyperclip>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/arpan404/bumblebee"
Repository = "https://github.com/arpan404/bumblebee"
Documentation = "https://github.com/arpan404/bumblebee#documentation"
Issues = "https://github.com/arpan404/bumblebee/issues"
Changelog = "https://github.com/arpan404/bumblebee/releases"

[project.optional-dependencies]
rl = [
  "gymnasium>=1.3.0",
  "rich>=15.0.0",
  "stable-baselines3>=2.9.0",
  "tensorboard>=2.20.0",
  "torch>=2.12.1",
  "tqdm>=4.68.3",
]
train = [
  "gymnasium>=1.3.0",
  "rich>=15.0.0",
  "stable-baselines3>=2.9.0",
  "tensorboard>=2.20.0",
  "torch>=2.12.1",
  "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
  "black>=25.1.0",
  "isort>=6.0.1",
  "twine>=6.1.0",
]
train = [
  "gymnasium>=1.3.0",
  "rich>=15.0.0",
  "stable-baselines3>=2.9.0",
  "tensorboard>=2.20.0",
  "torch>=2.12.1",
  "tqdm>=4.68.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bumblebee"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/bumblebee",
  "/README.md",
  "/PUBLISHING.md",
  "/SECURITY.md",
  "/docs",
  "/LICENSE.md",
]

[tool.hatch.build.targets.wheel.force-include]
"src/bumblebee/models/sac_mouse_v2.zip" = "bumblebee/models/sac_mouse_v2.zip"
"src/bumblebee/models/manifest.json" = "bumblebee/models/manifest.json"
"src/bumblebee/models/MODEL_CARD.md" = "bumblebee/models/MODEL_CARD.md"

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
src_paths = ["src"]
