name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish built distributions to PyPI using trusted publishing.
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install runtime and dev dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run black --check .

      - name: Check import sorting
        run: uv run isort --check-only .

      - name: Compile Python sources
        run: uv run python -m compileall scripts src

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uv run twine check dist/*

      - name: Verify packaged model assets in wheel
        run: uv run python .github/scripts/check_wheel_assets.py

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp src/bumblebee/models/sac_mouse_v2.zip release-assets/model.zip
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = sorted(p for p in Path("dist").glob("*") if p.is_file() and not p.name.startswith("."))
          paths += sorted(p for p in Path("release-assets").glob("*") if p.is_file() and p.name != "SHA256SUMS.txt")
          with Path("release-assets/SHA256SUMS.txt").open("w", encoding="utf-8") as fh:
              for path in paths:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  line = f"{digest}  {path.name}"
                  print(line)
                  fh.write(line + "\n")
          PY

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist
            release-assets
          if-no-files-found: error

  github-release-assets:
    name: Upload GitHub release assets
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Show downloaded release files
        run: find release-files -maxdepth 4 -type f -print | sort

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/**/*.whl
            release-files/**/*.tar.gz
            release-files/**/model.zip
            release-files/**/SHA256SUMS.txt

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || inputs.publish_pypi
    environment:
      name: pypi
      url: https://pypi.org/project/the-bumblebee/

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Collect Python distributions
        run: |
          mkdir -p publish-dist
          find release-files -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} publish-dist/ \;
          ls -la publish-dist

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist
